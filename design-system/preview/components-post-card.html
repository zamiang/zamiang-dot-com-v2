<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); margin-top: 8px; }
  .post-meta { font-family: var(--font-sans); font-size: 14px; color: var(--muted-foreground); }
  .post-title { font-family: var(--font-serif); font-size: 22px; font-weight: 500; margin: 4px 0 6px 0; color: var(--foreground); }
  .post-title a { color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, #749ca8 50%, transparent); }
  .excerpt { font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: rgba(44,51,58,0.7); margin: 0; }
  .post { padding: 12px 0; border-bottom: 1px solid rgba(209,213,219,0.3); }
</style>
</head>
<body>
<div class="post">
  <div class="post-meta">Apr 14, 2026</div>
  <div class="post-title"><a href="#">The Last Mile Problem in Engineering Leadership</a></div>
  <div class="excerpt">Most engineering managers can ship a feature. The real test is whether the team still ships it three months after you stop watching.</div>
</div>
<div class="label">PostCard — date · serif title · 2-line excerpt clamp · hairline divider</div>
</body>
</html>
