<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .next-post { background: rgba(227,231,235,0.8); padding: 18px 20px; border: 1px solid rgba(116,156,168,0.2); border-radius: 8px; transition: background-color 200ms, border-color 200ms; }
  .next-post:hover { background: #e3e7eb; border-color: rgba(116,156,168,0.4); }
  .next-button { display: inline-block; background: #5a7684; color: #f0f2f5; font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 6px; margin-bottom: 10px; }
  .title { font-family: var(--font-serif); font-size: 18px; font-weight: 500; margin: 0; }
  .title a { color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, #749ca8 50%, transparent); }
  .excerpt { font-family: var(--font-sans); font-size: 14px; color: rgba(44,51,58,0.7); margin-top: 6px; line-height: 1.5; }

  .current-post { position: relative; padding-left: 1rem; opacity: 0.95; }
  .current-post::before { content: ''; position: absolute; left: 0; top: 0.5rem; bottom: 0.5rem; width: 3px; background: var(--accent); border-radius: 2px; }
  .current-post .title a { color: var(--accent); font-weight: 600; }

  .past-post { opacity: 0.5; }
  .past-post .title a { color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="stack">
  <div class="past-post">
    <div class="title"><a href="#">Part 1: The Insurance Layer</a></div>
  </div>
  <div class="current-post">
    <div class="title"><a href="#">Part 2: Why Coordination Beats Capacity</a></div>
  </div>
  <div class="next-post">
    <div class="next-button">Next</div>
    <div class="title"><a href="#">Part 3: What ACOs Actually Do</a></div>
    <div class="excerpt">A walk through the structural reason most accountable care organizations underperform their projections.</div>
  </div>
</div>
</body>
</html>
