<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 80px 1fr 110px; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px dashed rgba(209,213,219,0.6); }
  .row:last-child { border-bottom: 0; }
  .key { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); text-align: right; }
  .demo { font-family: var(--font-serif); }
</style>
</head>
<body>
  <div class="row"><div class="key">4xl</div><div class="demo" style="font-size:48px; font-weight:700; line-height:1;">Aa</div><div class="val">36–48px / 1.3</div></div>
  <div class="row"><div class="key">3xl</div><div class="demo" style="font-size:40px; font-weight:500; line-height:1;">Aa</div><div class="val">30–40px / 1.3</div></div>
  <div class="row"><div class="key">2xl</div><div class="demo" style="font-size:30px; font-weight:600; line-height:1;">Aa</div><div class="val">24–30px / 1.3</div></div>
  <div class="row"><div class="key">xl</div><div class="demo" style="font-size:24px; font-weight:600; line-height:1;">Aa</div><div class="val">20–24px / 1.4</div></div>
  <div class="row"><div class="key">lg</div><div class="demo" style="font-size:20px; font-weight:600; line-height:1;">Aa</div><div class="val">18–20px / 1.4</div></div>
  <div class="row"><div class="key">base</div><div class="demo" style="font-size:18px; font-weight:400; line-height:1; font-family:var(--font-sans);">Aa</div><div class="val">16–18px / 1.7</div></div>
  <div class="row"><div class="key">sm</div><div class="demo" style="font-size:15px; font-weight:400; line-height:1; font-family:var(--font-sans);">Aa</div><div class="val">14–15px / 1.5</div></div>
</body>
</html>
