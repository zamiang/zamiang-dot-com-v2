<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .photo { aspect-ratio: 1/1; border-radius: 2px; overflow: hidden; background: #e8eaed; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); margin-top: 8px; }
</style>
</head>
<body>
<div class="grid">
  <div class="photo"><img src="../assets/photos/portrait-bw.jpg" alt="" /></div>
  <div class="photo"><img src="../assets/photos/landscape-warm.jpg" alt="" /></div>
  <div class="photo"><img src="../assets/photos/architectural.jpg" alt="" /></div>
  <div class="photo"><img src="../assets/photos/quiet-detail.jpg" alt="" /></div>
</div>
<div class="label">PhotoCard grid — square crop · 2px radius · 6px gap · hover opacity 0.85</div>
</body>
</html>
