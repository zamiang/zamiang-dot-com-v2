<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; }
  .icon { display: flex; align-items: center; justify-content: center; height: 48px; color: var(--foreground); }
  svg { width: 24px; height: 24px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="grid">
  <div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
    </div>
    <div class="label">menu · 1.5 stroke</div>
  </div>
  <div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </div>
    <div class="label">close · 1.5 stroke</div>
  </div>
  <div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l15-15M8.25 4.5h11.25v11.25"/></svg>
    </div>
    <div class="label">external · 2 stroke</div>
  </div>
  <div>
    <div class="icon" style="font-family: var(--font-sans); font-size: 24px; color: rgba(74,85,96,0.7); letter-spacing: 0.2em;">·</div>
    <div class="label">middle dot · meta sep</div>
  </div>
</div>
</body>
</html>
