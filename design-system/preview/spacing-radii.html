<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 100%; height: 70px; background: #ffffff; border: 1px solid var(--border); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); text-align: center; line-height: 1.4; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="swatch" style="border-radius: 0;"></div><div class="label">0<br>none</div></div>
  <div class="item"><div class="swatch" style="border-radius: 2px;"></div><div class="label">2px<br>sm · photos</div></div>
  <div class="item"><div class="swatch" style="border-radius: 4px;"></div><div class="label">4px<br>headings · code</div></div>
  <div class="item"><div class="swatch" style="border-radius: 8px;"></div><div class="label">8px<br>lg · cards</div></div>
  <div class="item"><div class="swatch" style="border-radius: 9999px;"></div><div class="label">pill<br>VBC badge</div></div>
</div>
</body>
</html>
