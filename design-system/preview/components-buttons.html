<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .btn { font-family: var(--font-sans); font-size: 16px; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; transition: background-color 200ms cubic-bezier(.33,1,.68,1); }
  .next-button { background: #5a7684; color: #f0f2f5; }
  .next-button:hover { background: color-mix(in srgb, #5a7684 85%, black); }
  .copper { background: #c17f59; color: #ffffff; }
  .copper:hover { background: #d4906a; }
  .ghost { background: transparent; color: #2c333a; border-bottom: 1px solid color-mix(in srgb, #749ca8 60%, transparent); border-radius: 0; padding: 2px 0; font-size: 16px; font-weight: 400; }
  .ghost:hover { color: #749ca8; border-bottom-color: #749ca8; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 12px; border-radius: 4px; background: rgba(116,156,168,0.15); color: #749ca8; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="row">
  <button class="btn next-button">Next</button>
  <button class="btn copper">Read more</button>
  <a class="btn ghost" href="#">Inline link</a>
  <span class="badge">VBC</span>
</div>
<div class="label">Primary (steel) · Bold (copper, rare) · Inline (underlined accent) · VBC pill badge</div>
</body>
</html>
