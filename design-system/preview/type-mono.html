<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  pre { font-family: var(--font-mono); font-size: 13px; background: #e8eaed; color: #2c333a; padding: 14px 16px; border-radius: 4px; margin: 0; line-height: 1.5; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 8px; }
  code { font-family: var(--font-mono); background: #e8eaed; padding: 1px 5px; border-radius: 3px; font-size: 14px; }
</style>
</head>
<body>
<pre><span style="color:#5a7684;">function</span> reading_time(words) {
  <span style="color:#5a7684;">return</span> Math.ceil(words / <span style="color:#c17f59;">200</span>);
}</pre>
<div class="meta">pre · Consolas / Monaco / Andale Mono · muted bg · 4px radius</div>
<div style="margin-top: 14px; font-size: 16px;">Inline <code>code</code> sits flush with running prose.</div>
</body>
</html>
