<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); margin-top: 6px; }
  .container { background: #fff; padding: 14px 16px; border-radius: 6px; }
  .timing { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--foreground); }
  .desc { font-family: var(--font-sans); font-size: 12px; color: var(--muted-foreground); margin-top: 2px; line-height: 1.5; }
</style>
</head>
<body>
<div class="grid">
  <div class="container">
    <div class="timing">150ms · fast</div>
    <div class="desc">color · focus · link border</div>
  </div>
  <div class="container">
    <div class="timing">200ms · normal</div>
    <div class="desc">hovers · state · background</div>
  </div>
  <div class="container">
    <div class="timing">300ms · slow</div>
    <div class="desc">transforms (rare)</div>
  </div>
  <div class="container">
    <div class="timing" style="font-family:var(--font-mono); font-size:11px;">cubic-bezier(.33, 1, .68, 1)</div>
    <div class="desc">--ease-out · quart-out · the only curve</div>
  </div>
</div>
<div class="label">All animation gated by <code>@media (prefers-reduced-motion: reduce)</code>.</div>
</body>
</html>
