<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 24px; box-sizing: border-box; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
</style>
</head>
<body>
  <div style="font-family: var(--font-serif); font-size: 48px; font-weight: 700; line-height: 1.1; color: var(--foreground);">EB Garamond</div>
  <div class="meta">Display · h1 · 36–48px · weight 700 · line-height 1.3</div>
  <div style="font-family: var(--font-serif); font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 14px;">The quiet authority of a serif.</div>
  <div class="meta">h2 · 24–30px · weight 600</div>
  <div style="font-family: var(--font-serif); font-size: 22px; font-style: italic; color: var(--muted-foreground); margin-top: 14px;">Italics earn emphasis; never decoration.</div>
  <div class="meta">tagline · serif italic · muted-foreground</div>
</body>
</html>
