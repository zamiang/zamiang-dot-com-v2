<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  .toc { background: rgba(232,234,237,0.5); border: 1px solid rgba(209,213,219,0.4); border-radius: 8px; padding: 16px 18px; }
  .toc-label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-foreground); margin-bottom: 8px; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { margin: 0; padding: 2px 0; }
  .toc a { font-family: var(--font-sans); font-size: 14px; color: rgba(44,51,58,0.7); text-decoration: none; border: none; line-height: 1.6; }
  .toc a:hover { color: var(--foreground); }
  .l2 { padding-left: 0; }
  .l3 { padding-left: 1rem; }
</style>
</head>
<body>
<nav class="toc">
  <div class="toc-label">In This Article</div>
  <ul>
    <li class="l2"><a href="#">The Three Failure Modes</a></li>
    <li class="l3"><a href="#">Underestimating the carry</a></li>
    <li class="l3"><a href="#">Replacing yourself too late</a></li>
    <li class="l2"><a href="#">A Working Definition</a></li>
    <li class="l2"><a href="#">What Actually Helps</a></li>
  </ul>
</nav>
</body>
</html>
