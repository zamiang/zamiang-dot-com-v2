<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--background); }
  body { font-family: var(--font-sans); color: var(--foreground); padding: 22px 24px; box-sizing: border-box; }
  blockquote { margin: 0; padding-left: 1.5em; border-left: 4px solid var(--accent); font-family: var(--font-serif); font-style: italic; font-size: 20px; line-height: 1.7; color: var(--foreground); }
  .attribution { font-family: var(--font-sans); font-size: 13px; color: var(--muted-foreground); margin-top: 12px; padding-left: calc(1.5em + 4px); }
</style>
</head>
<body>
<blockquote>The hard part of healthcare isn't the medicine. It's the consolidated fragmentation of the people paying for it.</blockquote>
<div class="attribution">— Why Value-Based Care is Harder Than Rocket Science</div>
</body>
